<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">Dinkly green pickleball logo</title>
  <desc id="description">A shaded green pickleball with holes inside a rounded green square.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55d58a"/>
      <stop offset="1" stop-color="#3cc47a"/>
    </linearGradient>
    <radialGradient id="ball" cx="32%" cy="26%" r="72%">
      <stop offset="0" stop-color="#a6d77b"/>
      <stop offset=".45" stop-color="#62b96b"/>
      <stop offset=".8" stop-color="#329b5d"/>
      <stop offset="1" stop-color="#23734d"/>
    </radialGradient>
    <radialGradient id="hole" cx="32%" cy="28%" r="70%">
      <stop offset="0" stop-color="#385c42"/>
      <stop offset="1" stop-color="#173d32"/>
    </radialGradient>
    <clipPath id="ballClip"><circle cx="32" cy="32" r="19"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#background)"/>
  <circle cx="32" cy="32" r="19" fill="url(#ball)"/>
  <g clip-path="url(#ballClip)" fill="url(#hole)">
    <circle cx="23" cy="17" r="2"/><circle cx="30" cy="15" r="2"/><circle cx="37" cy="17" r="2"/>
    <circle cx="19" cy="22" r="2"/><circle cx="26" cy="21" r="2"/><circle cx="34" cy="21" r="2"/><circle cx="42" cy="23" r="2"/>
    <circle cx="16" cy="28" r="2"/><circle cx="23" cy="27" r="2"/><circle cx="31" cy="27" r="2"/><circle cx="39" cy="28" r="2"/><circle cx="46" cy="29" r="2"/>
    <circle cx="15" cy="35" r="2"/><circle cx="22" cy="34" r="2"/><circle cx="30" cy="34" r="2"/><circle cx="38" cy="35" r="2"/><circle cx="45" cy="36" r="2"/>
    <circle cx="18" cy="42" r="2"/><circle cx="25" cy="41" r="2"/><circle cx="33" cy="41" r="2"/><circle cx="41" cy="42" r="2"/>
    <circle cx="23" cy="47" r="2"/><circle cx="31" cy="47" r="2"/><circle cx="38" cy="46" r="2"/>
  </g>
  <ellipse cx="25" cy="24" rx="5" ry="3" fill="#d8efaa" opacity=".26" transform="rotate(-28 25 24)"/>
</svg>
